@{
    ViewData["Title"] = "合营结算记录";
    Layout = null;
}


<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>会员列表</title>
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="stylesheet" href="/static/css/font.css" />
    <link rel="stylesheet" href="/static/css/weadmin.css" />
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <script src="/js/vue.js"></script>
    <script src="/js/vue-paginate.js"></script>
    <script src="/js/axios.js"></script>
    <script src="/js/globalmixin.js"></script>

</head>

<body>
    <div class="weadmin-nav">
        <span class="layui-breadcrumb">
            <a href="javascript:;">首页</a> <a href="javascript:;">会员管理</a>
            <a href="javascript:;"> <cite>会员列表</cite></a>
        </span>
        <a class="layui-btn layui-btn-sm" style="margin-top:3px;float:right" href="javascript:location.replace(location.href);"
           title="刷新">
            <i class="layui-icon layui-icon-refresh"></i>
            <!-- <i class="layui-icon" style="line-height:30px">&#x1002;</i> -->
        </a>

    </div>

    <div class="weadmin-body" id="app">
        <div class="layui-row">
            <form class="layui-col-md12 we-search">

                <div class="layui-inline">
                    <input v-model="input.account" placeholder="账号" />
                </div>

                <div class="layui-inline">
                    <input v-model="input.orderno" placeholder="商户单号" />
                </div>
                <div class="layui-inline">
                    <select v-model.lazy="input.payplatform">
                        <option v-for="option in platformlist" v-bind:value="option.id">
                            {{ option.name }}
                        </option>
                    </select>
                </div>

                <div class="layui-inline">
                    <input v-model="input.requesttime" placeholder="提交时间" />
                </div>
                <div class="layui-inline">
                    <input v-model="input.ipaddress" placeholder="存款IP" />
                </div>
                <div class="layui-inline">
                    <input v-model="input.affiliate" placeholder="代理" />
                </div>
                <div class="layui-inline">
                    <select v-model.lazy="input.status">
                        <option v-for="option in statuslist" v-bind:value="option.id">
                            {{ option.label }}
                        </option>
                    </select>
                </div>




                <h1 class="layui-btn" lay-submit="" lay-filter="sreach" style="float:right" v-on:click="search(0)">
                    <i class="layui-icon layui-icon-search"></i>
                </h1>
            </form>
        </div>


        <table class="layui-table" id="memberList">
            <thead>
                <tr>

                    <th>账号</th>
                    <th>金额</th>
                    <th>请求时间</th>
                    <th>结速时间</th>
                    <th>商户订单号</th>
                    <th>银行订单号</th>
                    <th>支付平台</th>
                    <th>订单状态</th>
                    <th>手续费</th>
                    <th>返点</th>
                    <th>参与优惠</th>
                    <th>管理</th>

                </tr>
            </thead>
            <tbody>
                <template v-for="(item, index) in recordlist">
                    <tr class="more_info_k">
                        <!--<td>
                            <div class="layui-unselect layui-form-checkbox" lay-skin="primary" data-id="1">
                                <i class="layui-icon">&#xe605;</i>
                            </div>
                        </td>-->
                        <!--<td>{{ item.id }}<i class="layui-icon">&#xe625;</i></td>-->
                        <td>{{item.account}}</td>
                        <td>{{item.amount | currency}}</td>
                        <td>{{item.requesttime | standarddate}}</td>
                        <td>{{item.orderendtime | standarddate}}</td>
                        <td>{{item.merchantno}}</td>
                        <td>{{item.bankorderno}}</td>
                        <td>{{item.payplatformname}}</td>
                        <td class="td-status">
                            <span class="layui-btn layui-btn-normal layui-btn-xs" v-if="item.status==0">未审核</span>
                            <span class="layui-btn layui-btn-normal layui-btn-xs" v-if="item.status==1">审核成功</span>
                            <span class="layui-btn layui-btn-normal layui-btn-xs" v-if="item.status==2">申请取消</span>
                        </td>
                        <td>{{item.fee}}</td>
                        <td>{{item.fee}}</td>
                        <td>N/A</td>

                        <td class="td-manage">
                            <a href="javascript:;" title="启用">
                                <i class="layui-icon layui-icon-download-circle"></i>
                            </a>
                            <a title="编辑" v-on:click="editaccount(item.account)" href="javascript:;">
                                <i class="layui-icon layui-icon-edit"></i>
                            </a>
                        </td>
                    </tr>
                    <tr class="more_info hide">
                        <td colspan="9">
                            <ul>
                                <li>网站金额<span></span></li>
                                <li>积分<span></span></li>
                                <li>存款次数<span></span></li>
                                <li>提款次数<span></span></li>
                                <li>代理<span></span></li>
                            </ul>
                        </td>
                    </tr>

                </template>

            </tbody>
        </table>

        <!-- 分页 -->
        <div>
            <div style="text-align:center">
                <div id="pager"></div>
            </div>
        </div>

    </div>
    <script src="/design/layui.all.js" charset="utf-8"></script>
    <script src="/static/js/eleDel.js" type="text/javascript" charset="utf-8"></script>

    <script>
        //layui.use(['jquery'], function () {
        //    var $ = layui.jquery;
        //})

        Vue.component('paginate', VuejsPaginate);

        var app = new Vue({
            el: '#app',
            data: {
                pagemodel: {
                    pagecount: 50
                },
                statuslist: [
                    { id: -1, label: "所有" },
                    { id: 0, label: "未审核" },
                    { id: 1, label: "审核成功" },
                    { id: 2, label: "申请取消" }
                ],
                input: {
                    payplatform: -1,
                    status: -1,
                    pagesize: 10,
                    page: 0
                },
                platformlist: [],
                recordlist: []
            },
            mounted: function () {
                // Grab initial data
                var self = this;
                this.$nextTick(function () {
                    // Code that will run only after the
                    // entire view has been rendered

                    this.postwithauth('/Deposit/ThirdpayPlatforms',
                        {},
                        function (response) {
                            if (response.status == 200 && response.data.code == 1) {
                                self.platformlist = response.data.data;
                                self.platformlist.push({ "id": -1, "name": "所有" })
                                self.input.payplatform = -1
                                //self.levelist.push(new {"levelnumber":10001,"levels":"万象会员"});
                            }
                        });

                    this.search(0);
                });
                //window.alert("sometext");
                //axios
                //    .get('https://api.coindesk.com/v1/bpi/currentprice.json')
                //    .then(function (response) { window.alert(response); })
                //    .catch(error => { console.log(error) })

            },
            methods: {
                initpager: function (curPage, totalRecord) {
                    var self = this;
                    layui.use('laypage', function () {
                        var laypage = layui.laypage;
                        laypage.render({
                            elem: 'pager',
                            curr: curPage,
                            count: totalRecord,
                            limit: self.input.pagesize,
                            limits: [2, 10, 20, 30, 50],
                            layout: ['count', 'prev', 'page', 'next', 'limit', 'skip']
                            , jump: function (obj, first) {
                                console.info(obj);
                                console.info('limit:' + obj.limit);

                                if (!first) {
                                    self.search(obj.curr, obj.limit);
                                }
                            }
                        })
                    });

                },

                editaccount: function (item_id) {
                    //alert('editing account with id ' + item_id);
                    WeAdminEdit('编辑', './edit.html?id=' + item_id, 1, 800, 400);
                },
                search: function (_pageindex) {
                    //alert(_pageindex);
                    var self = this;
                    if (_pageindex) this.input.page = _pageindex;
                    if (!this.input.createtime) this.input.createtime = null;
                    this.input.pagesize = parseInt(this.input.pagesize);

                    this.postwithauth('/Deposit/ThirdpayList',
                        this.input
                        //{
                        //    createtime: this.input.createtime,
                        //    PageSize: parseInt(this.input.pagesize)
                        //}
                        , function (response) {
                            if (response.status == 200 && response.data.code == 1) {
                                self.recordlist = response.data.data.data;
                                var totalItems = response.data.data.totalItems;
                                self.pagemodel.pagecount = parseInt(totalItems / self.input.pagesize);
                                self.initpager(_pageindex, totalItems);
                            }
                            else
                                console.info(response);

                            setTimeout(function () {
                                layui.use(['jquery'], function () {
                                    var $ = layui.jquery;
                                    $('.more_info_k').on('click', function () {
                                        $(this).nextUntil('.more_info_k').toggleClass('hide');
                                    });
                                });
                            }, 500);
                        });

                    //window.alert("sometext");
                    //axios
                    //    .get('https://api.coindesk.com/v1/bpi/currentprice.json')
                    //    .then(function (response) { window.alert(response); })
                    //    .catch(error => { console.log(error) })
                }
            }
        });
    </script>
</body>
</html>
