<body>
    <div class="weadmin-nav">
        <span class="layui-breadcrumb">
            <a href="javascript:;">首页</a> <a href="javascript:;">会员管理</a>
            <a href="javascript:;"> <cite>会员列表</cite></a>

    <div class="weadmin-body">
        <div class="layui-row">
            <form class="layui-form layui-col-md12 we-search" lay-filter="formtest" id="formtest">
                检索条件：

                <!--账户   存款姓名    收款姓名     存款类型   代理        IP
                开始时间  结束时间  {查询/导出}-->


                <div class="layui-inline">
                    <input type="text" name="account" placeholder="账号" class="layui-input" id="input_account" />
                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="存款姓名" name="depositname" />
                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="收款姓名" name="receivename" />
                </div>

                <div class="layui-inline">
                    <select class="layui-input" name="deposittype">
                        <option value="" selected>==存款类型==</option>
                        <option value="ATM汇款">ATM汇款</option>
                        <option value="网银转账">网银转账</option>
                        <option value="支付宝转账">支付宝转账</option>
                    </select>
                </div>


                <div class="layui-inline">
                    <input class="layui-input" placeholder="代理" name="affaccount" />
                </div>
                <div class="layui-inline">
                    <input class="layui-input" placeholder="IP" name="ipaddress" />
                </div>

                <div class="layui-inline">
                    <select class="layui-input" name="status">
                        <option value=-1 selected>==全部==</option>
                        <option value=0>等待审核</option>
                        <option value=1>审核成功</option>
                        <option value=2>审核失败</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input class="layui-input" placeholder="开始时间" name="starttime" id="start" />
                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="结束时间" name="endtime" id="end" />
                </div>

                <button class="layui-btn layui-btn-normal" id="FORM-getval">
                    <i class="layui-icon layui-icon-search"></i>查询
                </button>
            </form>
        </div>
        <!--<div class="weadmin-block">
            <button class="layui-btn layui-btn-danger" onclick="delAll()">
                <i class="layui-icon layui-icon-delete"></i>批量删除
            </button>
            <button class="layui-btn layui-btn-normal" onclick="WeAdminShow('添加用户','./add.html',600,400)">

            </button>
            <span class="fr" style="line-height:40px">共有数据：88 条</span>

        <div class="table_scroll">
            <table id="maintable" class="layui-table" lay-filter="main"></table>
        </div>
        <script type="text/html" id="tools">
            {{#  if(d.status == 0){ }}
            <a class="layui-badge layui-bg-orange" lay-event="verify">审核</a>
            <a class="layui-badge layui-bg-red" lay-event="cancel">取消</a>
            {{#  } else {  }}
            <a class="layui-badge layui-bg-green" lay-event="details">查看详细</a>
            {{#  } }}
        </script>

        <script type="text/html" id="accountTpl">
            <a lay-event="details">{{d.account}}</a>
        </script>

        <script type="text/html" id="statusTpl">
            {{#  if(d.status == 0){ }}
            <span class="layui-badge layui-bg-gray">未审核</span>
            {{#  } else if(d.status == 1){  }}
            <span class="layui-badge layui-bg-green">审核成功</span>
            {{#  } else {  }}
            <span class="layui-badge layui-bg-red">申请取消</span>
            {{#  } }}
        </script>



    </div>
    <script src="/lib/layui/layui.js" charset="utf-8"></script>
    <script src="/static/js/eleDel.js" type="text/javascript" charset="utf-8"></script>
    <script src="/js/vue.js"></script>
    <script src="/js/axios.js"></script>
    <script src="/js/globalmixin.js"></script>

    <!--<script src="/js/axios.js"></script>
    <script src="/js/cfunc.js"></script>-->
    <script>
        var app = new Vue();
        var filters = app.$options.filters;

        layui.use(['table', 'form'], function () {
            var table = layui.table;

            var _headers = {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('acow8unasvef')
            };
            var _where = {};
            var maintable = table.render({
                elem: '#maintable'
                , url: _API + '/Deposit/NetList' //数据接口
                , method: 'post'
                , contentType: 'application/json'
                , headers: _headers
                , request: { pageName: 'page', limitName: 'pagesize' }
                , where: _where
                , page: true //开启分页
                , cols: [[ //表头
                    { field: 'account', title: '账号', sort: true, fixed: 'left', width: 131, toolbar: '#accountTpl' }
                    , { field: 'amount', title: '存款金额', sort: true, width: 111, templet: function (d) { return filters.currency(d.amount); } }, { field: 'realname', title: '存款姓名', width: 89 }
                    , { field: 'requesttime', title: '申请时间', width: 170, templet: function (d) { return filters.standarddate(d.requesttime); } }
                    , { field: 'reviewtime', title: '审核时间', width: 170, templet: function (d) { return filters.standarddate(d.reviewtime); } }
                    //, { field: 'levelname', title: '会员等级	', sort: true, width: 109 }
                    , { field: 'depositmethod', title: '存款类型', sort: true, width: 105 }
                    , { field: 'receiveperson', title: '收款人', width: 83 }
                    , { field: 'fee', title: '手续费', width: 73, templet: function (d) { return filters.currency(d.fee); } }
                    , { field: 'fee', title: '返点', width: 73, templet: function (d) { return filters.currency(d.fee); } }
                    , { field: 'status', title: '状态', sort: true, templet: '#statusTpl', width: 83 }
                    , { field: 'reviewperson', title: '审核人', width: 73 }
                    , { field: 'status', title: '管理', sort: true, toolbar: '#tools' }
                ]]
                , parseData: function (res) { //res 即为原始返回的数据
                    return {
                        "code": res.code == 1 ? 0 : 1, //解析接口状态
                        "msg": res.message, //解析提示文本
                        "count": res.data.totalItems, //解析数据长度
                        "data": res.data.data //解析数据列表
                    };
                }
            });

            //监听工具条
            table.on('tool(main)', function (obj) { //注：tool 是工具条事件名，test 是 table 原始容器的属性 lay-filter="对应的值"
                var data = obj.data; //获得当前行数据
                var layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）
                console.info(obj);
                var tr = obj.tr; //获得当前行 tr 的 DOM 对象（如果有的话）
                var idInt = parseInt(data.id);
                switch (layEvent) {
                    case 'verify':
                        layer.prompt({ title: '请输入返点' },
                            function (z, index, elem) {
                                var zfloat = parseFloat(z);
                                console.info(tr);
                                console.info(idInt);
                                //var xInt = parseInt(x);
                                postwithauth('/api/Deposit/VerifyRequest',
                                    { id: idInt, fee: zfloat }, function (response) {
                                        console.info(response);
                                        if (response.status == 200 && response.data.code == 1) {
                                            layer.close(index);
                                        }
                                        maintable.reload({ where: _where, page: { curr: 1 } });
                                    });
                            });
                        break;
                    case 'cancel':
                        layer.confirm('确定要取消？', {
                            btn: ['确定'] //可以无限个按钮
                        }, function (index, layero) {
                            postwithauth('/api/Deposit/CancelRequest',
                                { id: idInt }, function (response) {
                                    console.info(response);
                                    if (response.status == 200 && response.data.code == 1) {
                                        layer.close(index);
                                    }
                                    maintable.reload({ where: _where, page: { curr: 1 } });
                                }, function (err) { console.error(err); });
                        });

                        break;
                    case 'details':
                        WeAdminEdit('编辑', '../member/edit.html?id=' + data.account, 1, 800, 400);
                        break;

                    default:
                        break;
                }
            });

            var form = layui.form;

            //表单取值
            layui.$('#FORM-getval').on('click', function () {
                _where = layui.$('#formtest').serializeArray();
                _where = app.ArrayToObject(_where);
                _where.status = parseInt(_where.status);
                _where.level = parseInt(_where.level);
                maintable.reload({ where: _where, page: { curr: 1 } });
                return false;
            });
        });


    </script>



</body>
</html>
