                , contentType: 'application/json'
                , headers: app.postheaders()
                , request: _request
                , where: _where
                , page: true //开启分页
                , cols: [[ //表头
                    { field: 'account', title: '账号', sort: true, fixed: 'left', width: 117, toolbar: '#accountTpl' }
                    , {
                        field: 'amount', title: '存款金额', sort: true, width: 104, templet: function (d) { return filters.currency(d.amount); }
                    }
                    , { field: 'requesttime', title: '申请时间', width: 168, templet: function (d) { return filters.standarddate(d.requesttime); } }
                    , { field: 'orderendtime', title: '到账时间', width: 168, templet: function (d) { return filters.standarddate(d.orderendtime); } }
                    , { field: 'merchantno', title: '商户订单号', width: 249 }

                    return {
                        "code": res.code == 1 ? 0 : 1, //解析接口状态
                        "msg": res.message, //解析提示文本
                        "count": res.data.totalItems, //解析数据长度
                        "data": res.data.data //解析数据列表
                    };
                }
            });

            table.on('tool(test)', function (obj) { //注：tool 是工具条事件名，test 是 table 原始容器的属性 lay-filter="对应的值"
                var data = obj.data; //获得当前行数据
                var layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）
                switch (layEvent) {
                    case 'details':
                        WeAdminEdit('编辑', '../member/edit.html?id=' + data.account, 1, 800, 400);
                        break;

                        break;

            //    });
            //    return false;

            function ArrayToObject(arr) {
                var obj = {};
                for (var i = 0; i < arr.length; i++)
                    if (arr[i].value != undefined && arr[i].value != null && arr[i].value != '')
                        obj[arr[i].name] = arr[i].value;
                    else
                        obj[arr[i].name] = null;
                return obj;
            }
            //表单取值
            layui.$('#FORM-getval').on('click', function () {
                _where = layui.$('#formtest').serializeArray();
                _where = app.ArrayToObject(_where);
                _where.status = parseInt(_where.status);
                _where.level = parseInt(_where.level);
                console.info(_where);
                maintable.reload({ where: _where, page: { curr: 1 } });
                return false;
            });
