    <script>
        layui.use(['table', 'form'], function () {
            var table = layui.table;

            var _headers = {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('acow8unasvef')
            };
            var _request = {
                pageName: 'page' //页码的参数名称，默认：page
                , limitName: 'pagesize' //每页数据量的参数名，默认：limit
            };

            //第一个实例
            /*  SAMPLEDATA
                "code": 1,
                "message": "测试",
                "data": {
                "data": [
                    {
                    "id": 5071878,
                    "account": "longtai",
                    "amount": 18,
                    "reward": 0,
                    "createtime": "2019-10-08T09:18:37.29",
                    "remarks": "每日焦点赛事[99762175625861][自助申请]",
                    "level": 10001,
                    "bet": 1,
                    "createperson": "longtai",
                    "reviewperson": null,
                    "reviewtime": null,
                    "gametype": 138,
                    "referrer": "",
                    "referrerreg": "http://www.awc699.com",
                    "status": 0,
                    "visible": 1,
                    "ipaddress": "182.91.45.230",
                    "macaddress": "广西桂林市联通",
                    "reason": null,
                    "totalItems": 9780
                    },
             */
            var _where = {};
            function getParameterByName(name, url) {
                if (!url) url = window.location.href;
                name = name.replace(/[\[\]]/g, '\\$&');
                var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                    results = regex.exec(url);
                if (!results) return null;
                if (!results[2]) return '';
                return decodeURIComponent(results[2].replace(/\+/g, ' '));
            }
            var action = getParameterByName('action');
            var maintable = table.render({
                elem: '#maintable'
                , url: '/api/Withdraw/' + action //数据接口
                , method: 'post'
                , contentType: 'application/json'
                , headers: _headers
                , request: _request
                , where: _where
                , page: true //开启分页
                , cols: [[ //表头
                    { field: 'account', title: '账号', sort: true, fixed: 'left' }
                    , { field: 'realname', title: '名称', sort: true }
                    , { field: 'cardno', title: '卡号' }
                    , { field: 'amount', title: '提款金额' }
                    , { field: 'payperson', title: '付款人' }
                    , { field: 'requesttime', title: '申请时间	', sort: true }
                    , { field: 'levelname', title: '等级', sort: true }
                    , { field: 'level', title: '次数', sort: true }
                    , {
                        field: 'cardbank', title: '银行', templet: function (item) {
                            return '【' + item.cardbank + '】 ' + item.cardaddress;
                        }
                    }
                    //, { field: 'fee', title: '返点' }
                    , { field: 'status', title: '状态', templet: '#statusTpl' }
                    , { field: 'status', title: '管理', sort: true, toolbar: '#barDemo' }


                ]]
                , parseData: function (res) { //res 即为原始返回的数据
                    return {
                        "code": res.code == 1 ? 0 : 1, //解析接口状态
                        "msg": res.message, //解析提示文本
                        "count": res.data.totalItems, //解析数据长度
                        "data": res.data.data //解析数据列表
                    };
                }
            });



            var form = layui.form;
            ////给表单赋值
            //form.val("formtest", { //formTest 即 class="layui-form" 所在元素属性 lay-filter="" 对应的值
            //    "account": "maigangcai" // "name": "value"
            //    , "remarks": "周周存送"

            //});


            //表单赋值
            //layui.$('#FORM-setval').on('click', function () {
            //    form.val('formtest', {
            //        "account": "john2602" // "name": "value"
            //        , "remarks": "村村松松"
            //    });
            //    return false;
            //});

            function ArrayToObject(arr) {
                var obj = {};
                for (var i = 0; i < arr.length; i++)
                    if (arr[i].value != undefined && arr[i].value != null && arr[i].value != '')
                        obj[arr[i].name] = arr[i].value;
                    else
                        obj[arr[i].name] = null;
                return obj;
            }
            //表单取值
            layui.$('#FORM-getval').on('click', function () {
                _where = layui.$('#formtest').serializeArray();
                _where = ArrayToObject(_where);
                _where.status = parseInt(_where.status);
                _where.level = parseInt(_where.level);
                console.info(_where);
                maintable.reload({ where: _where, page: { curr: 1 } });
                return false;
            });

            //form.on('submit(formtest)', function (data) {
            //    var data1 = form.val();
            //    alert(JSON.stringify(data));
            //    alert(JSON.stringify(data1));
            //    return false;
            //});


            //监听锁定操作
            //form.on('checkbox(lockDemo)', function (obj) {
            //    layer.tips(this.value + ' ' + this.name + '：' + obj.elem.checked, obj.othis);
            //});
        });
    </script>
