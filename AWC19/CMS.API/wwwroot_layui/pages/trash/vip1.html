<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title></title>
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="stylesheet" href="../../static/css/font.css" />
    <link rel="stylesheet" href="../../static/css/weadmin.css" />
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

    <script src="/js/vue.js"></script>
    <script src="/js/vue-paginate.js"></script>
    <script src="/js/axios.js"></script>
    <script src="/js/globalmixin.js"></script>

</head>

<body>
    <div class="weadmin-nav">
        <span class="layui-breadcrumb">
            <a href="javascript:;">首页</a> <a href="javascript:;">会员管理</a>
            <a href="javascript:;"> <cite>会员列表</cite></a>
        </span>
        <a class="layui-btn layui-btn-sm" style="margin-top:3px;float:right" href="javascript:location.replace(location.href);"
           title="刷新">
            <i class="layui-icon layui-icon-refresh"></i>
            <!-- <i class="layui-icon" style="line-height:30px">&#x1002;</i> -->
        </a>

    </div>

    <div class="weadmin-body" id="app">
        <div class="layui-row">
            <div class="layui-col-md12 we-search">
                <div class="layui-inline">
                    <input v-model="input.account" placeholder="账号" />
                </div>

                <div class="layui-inline">
                    <input v-model="input.cardno" placeholder="卡号" />
                </div>
                <div class="layui-inline">
                    <input v-model="input.bank" placeholder="银行" />
                </div>

                <div class="layui-inline">
                    <input v-model="input.verifytime" placeholder="提交时间" />
                </div>

                <div class="layui-inline">
                    <select v-model.lazy="input.status">
                        <option v-for="option in statuslist" v-bind:value="option.id">
                            {{ option.label }}
                        </option>
                    </select>
                </div>

                <h1 class="layui-btn" lay-submit="" lay-filter="sreach" style="float:right" v-on:click="search(0)">
                    <i class="layui-icon layui-icon-search"></i>
                </h1>


            </div>
        </div>


        <table class="layui-table" id="memberList">
            <thead>
                <tr>
                    <th>账号</th>
                    <th>名称</th>
                    <th>卡号</th>
                    <th>提款金额</th>
                    <th>付款人</th>
                    <th>申请时间</th>
                    <th>等级</th>
                    <th>次数</th>
                    <th>银行</th>
                    <th>管理</th>
                </tr>
            </thead>
            <tbody>
                <template v-for="(item, index) in recordlist">
                    <tr class="more_info_k">
                        <!--<td>
                            <div class="layui-unselect layui-form-checkbox" lay-skin="primary" data-id="1">
                                <i class="layui-icon">&#xe605;</i>
                            </div>
                        </td>-->
                        <!--<td>{{ item.id }}<i class="layui-icon">&#xe625;</i></td>-->
                        <td v-on:dblclick="editaccount(item.account)">{{item.account}}</td>
                        <td>{{item.realname}}</td>
                        <td>{{item.cardno}}</td>
                        <td>{{item.amount}}</td>
                        <td>{{item.payperson}}</td>
                        <td>{{item.requesttime}}</td>
                        <td>{{item.levelname}}</td>
                        <td></td>
                        <td>【{{item.cardbank}}】 {{item.cardaddress}}</td>
                        <td class="td-status">
                            <span class="layui-btn layui-btn-normal layui-btn-xs" v-if="item.status==3">提款取消</span>
                            <span class="layui-btn layui-btn-normal layui-btn-xs" v-if="item.status==2">支付成功</span>
                            <span v-if="item.status==1 && isalsocheckuser(item.checkperson)">
                                <span class="layui-btn layui-btn-normal layui-btn-xs">取消</span>
                                <span class="layui-btn layui-btn-normal layui-btn-xs">手动支付</span>
                                <span class="layui-btn layui-btn-normal layui-btn-xs">代付</span>
                            </span>
                            <span class="layui-btn layui-btn-normal layui-btn-xs" v-if="item.status==1 && !item.checkperson" v-on:dblclick="lockwithdrawrequest(item)">锁住</span>
                            <span class="layui-btn layui-btn-normal layui-btn-xs" v-if="item.status==0">未审核</span>
                        </td>
                        <!--<td class="td-manage">
                            <a href="javascript:;" title="启用">
                                <i class="layui-icon layui-icon-download-circle"></i>
                            </a>
                            <a title="编辑" v-on:click="editaccount(item.account)" href="javascript:;">
                                <i class="layui-icon layui-icon-edit"></i>
                            </a>
                        </td>-->
                    </tr>
                </template>

            </tbody>
        </table>
        <div>
            <div class="page">
                <paginate :page-count=pagemodel.pagecount
                          :page-class="page"
                          :container-class="page"
                          :prev-text="'&lt;&lt;'"
                          :next-text="'&gt;&gt;'"
                          :no-li-surround="true"
                          :active-class="'current'"
                          :break-view-class="'num'"
                          :click-handler="search">

                    <a class="prev" slot="prevContent">Changed previous button</a>
                    <span slot="nextContent">Changed next button</span>


                </paginate>
                <div class="layui-inline">
                    <input class="layui-input" type="number" v-model="input.pagesize" placeholder="10条" value=10 />
                </div>
            </div>
        </div>
    </div>
    <script src="/lib/layui/layui.js" charset="utf-8"></script>
    <script src="../../static/js/eleDel.js" type="text/javascript" charset="utf-8"></script>

    <script>
        Vue.component('paginate', VuejsPaginate);

        var app = new Vue({
            el: '#app',
            data: {
                pagemodel: {
                    pagecount: 50
                },
                input: {
                    pagesize: 10,
                    status: -1
                },
                teststatus: 0,
                recordlist: [],
                statuslist: [
                    { id: -1, label: "所有" },
                    { id: 0, label: "未审核" },
                    { id: 1, label: "等待支付" },
                    { id: 2, label: "支付成功" },
                    { id: 3, label: "提款取消" },
                ]
            },
            computed: {
            },
            mounted: function () {
                // Grab initial data
                this.$nextTick(function () {
                    this.search(0);
                });
            },
            methods: {
                isalsocheckuser: function (checkuser) {
                    return true;
                    console.info(JSON.stringify(checkuser));
                    return this.loginusername() == checkuser.toLowerCase();
                },
                editaccount: function (item_id) {
                    WeAdminEdit('编辑', '../member/edit.html?id=' + item_id, 1, 800, 400);
                },
                lockwithdrawrequest: function (item) {
                    var selfitem = item;
                    console.info("locking item:" + item.id);
                    this.postwithauth('/Withdraw/LockWithdrawRequest',
                        { id: item.id },
                        function (response) {
                            alert(JSON.stringify(response));
                            if (response.status == 200 && response.data.code == 1) {
                                selfitem.cardno = response.data.data.cardno;
                                selfitem.amount = response.data.data.amount;
                                selfitem.checkperson = response.data.data.checkperson;
                            }
                            else
                                console.info(response);
                            //setTimeout(function () {
                            //    layui.use(['jquery'], function () {
                            //        var $ = layui.jquery;
                            //        $('.more_info_k').on('click', function () {
                            //            $(this).nextUntil('.more_info_k').toggleClass('hide');
                            //        });
                            //    });
                            //}, 500);
                        });

                },
                search: function (_pageindex) {
                    //alert(_pageindex);
                    var self = this;
                    if (_pageindex) this.input.Page = _pageindex;
                    if (!this.input.createtime) this.input.createtime = null;
                    this.input.pagesize = parseInt(this.input.pagesize);

                    console.info(JSON.stringify(this.input));
                    console.info(JSON.stringify(this.input.status));
                    //alert(this.teststatus);
                    var action = getParameterByName('action');
                    action = decodeURIComponent(action);
                    this.postwithauth('/Withdraw/'+ action,
                        this.input,
                        function (response) {
                            if (response.status == 200 && response.data.code == 1) {
                                self.recordlist = response.data.data.data;
                                var totalItems = response.data.data.totalItems;
                                console.info("totalItems: " + totalItems);
                                self.pagemodel.pagecount = parseInt(totalItems / self.input.pagesize);
                                console.info("pagecount: " + self.pagemodel.pagecount);
                            }
                            else
                                console.info(response);

                            setTimeout(function () {
                                layui.use(['jquery'], function () {
                                    var $ = layui.jquery;
                                    $('.more_info_k').on('click', function () {
                                        $(this).nextUntil('.more_info_k').toggleClass('hide');
                                    });
                                });
                            }, 500);
                        });
                }
            }
        });
    </script>
</body>
</html>
