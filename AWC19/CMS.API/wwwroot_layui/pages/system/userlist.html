
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>优惠内容管理</title>
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="stylesheet" href="../../static/css/font.css" />
    <link rel="stylesheet" href="../../static/css/weadmin.css" />
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body>
    <div class="weadmin-nav">
        <span class="layui-breadcrumb">
            <a href="javascript:;">首页</a> <a href="javascript:;">会员管理</a>
            <a href="javascript:;"> <cite>会员列表</cite></a>
        </span>
        <a class="layui-btn layui-btn-sm" style="margin-top:3px;float:right" href="javascript:location.replace(location.href);"
           title="刷新">
            <i class="layui-icon layui-icon-refresh"></i>
            <!-- <i class="layui-icon" style="line-height:30px">&#x1002;</i> -->
        </a>
    </div>
    <div class="weadmin-body">
        <div class="layui-row">
            <form class="layui-form layui-col-md12 we-search" id="formtest">
                检索条件：
                <div class="layui-inline">
                    <input type="text" name="account" placeholder="账号" class="layui-input" />
                </div>

                <div class="layui-inline">
                    <select class="layui-input" name="belongs">
                        <option value="" selected>==所有会员等级==</option>
                        <option value='CS'>客服部</option>
                        <option value='AE'>技术部</option>
                        <option value='FI'>账务部</option>
                        <option value='MK'>市场部</option>
                        <option value='SC'>策划部</option>
                        <option value='AF'>代理部</option>
                        <option value='AD'>行政部</option>
                        <option value='MD'>管理部</option>
                        <option value='WE'>测试部</option>
                        <option value='PH'>出款部</option>
                    </select>
                </div>

                <div class="layui-inline">
                    <select class="layui-input" name="status">
                        <option value=-1 selected>==账号状态==</option>
                        <option value=0>冻结</option>
                        <option value=1>正常</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <select class="layui-input" name="online">
                        <option value=-1 selected>==在线状态==</option>
                        <option value=0>不在线</option>
                        <option value=1>在线</option>
                    </select>
                </div>
                <button class="layui-btn layui-btn-normal" id="FORM-getval">
                    <i class="layui-icon layui-icon-search"></i>查询
                </button>
            </form>
        </div>
        <div class="weadmin-block">
            <button class="layui-btn layui-btn-normal" onclick="WeAdminShow('添加用户','./add.html',600,400)">
                <i class="layui-icon layui-icon-add-circle-fine"></i>添加
            </button>
            <span class="fr" style="line-height:40px">共有数据：88 条</span>
        </div>


        <table id="maintable" lay-filter="test"></table>

        <script type="text/html" id="barDemo">
            <a class="layui-btn layui-btn-xs" lay-event="edit" onclick="editaccount('{{d.account}}')">编辑</a>
        </script>

        <script type="text/html" id="onlineTpl">
            <input type="checkbox" name="lock" value="{{d.id}}" title="在线" lay-filter="lockDemo" {{ d.online == 1 ? 'checked' : '' }}>
        </script>
        <script type="text/html" id="statusTpl">
            <input type="checkbox" name="lock" value="{{d.id}}" title="正常" lay-filter="lockDemo" {{ d.status == 1 ? 'checked' : '' }}>
        </script>
    </div>
    <script src="/lib/layui/layui.js" charset="utf-8"></script>
    <script src="/static/js/eleDel.js" type="text/javascript" charset="utf-8"></script>
    <script src="/js/vue.js"></script>
    <script src="/js/axios.js"></script>
    <script src="/js/globalmixin.js"></script>

    <script>

        layui.use(['table', 'form'], function () {
            var table = layui.table;

            var _headers = {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('acow8unasvef')
            };
            var _request = {
                pageName: 'page' //页码的参数名称，默认：page
                , limitName: 'pagesize' //每页数据量的参数名，默认：limit
            };


            window.editaccount = function (item_id) {
                WeAdminEdit('编辑', './useredit.html?id=' + item_id, 1, 800, 400);
            }

            var _where = {};

            var maintable = table.render({
                elem: '#maintable'
                , url: _API + '/System/UsersRecord' //数据接口
                , method: 'post'
                , contentType: 'application/json'
                , headers: _headers
                , request: _request
                , where: _where
                , page: true //开启分页
                , cols: [[ //表头
                    { field: 'account', title: '账号', sort: true, fixed: 'left' }
                    , { field: 'belongs', title: '分组' }
                    , { field: 'online', title: '在线', sort: true, templet: '#onlineTpl' }
                    , { field: 'status', title: '状态', templet: '#statusTpl' }
                    , { field: 'currentlogintime', title: '登录时间', }
                    //, { field: 'ipaddress', title: '注册IP', }
                    , { field: 'lastactivetime', title: '活跃时间	', sort: true }
                    , { field: 'createtime', title: '开户时间', sort: true }
                    , { field: '', title: '操作', toolbar: '#barDemo' }
                ]]
                , parseData: function (res) { //res 即为原始返回的数据
                    return {
                        "code": res.code == 1 ? 0 : 1, //解析接口状态
                        "msg": res.message, //解析提示文本
                        "count": res.data.totalItems, //解析数据长度
                        "data": res.data.data //解析数据列表
                    };
                }
            });



            var form = layui.form;
            function ArrayToObject(arr) {
                var obj = {};
                for (var i = 0; i < arr.length; i++)
                    if (arr[i].value != undefined && arr[i].value != null && arr[i].value != '')
                        obj[arr[i].name] = arr[i].value;
                    else
                        obj[arr[i].name] = null;
                return obj;
            }
            //表单取值
            layui.$('#FORM-getval').on('click', function () {
                _where = layui.$('#formtest').serializeArray();
                console.info(_where);
                _where = ArrayToObject(_where);
                console.info(_where);
                _where.status = parseInt(_where.status);
                _where.online = parseInt(_where.online);
                maintable.reload({ where: _where, page: { curr: 1 } });
                return false;
            });
        });
    </script>



</body>
</html>
