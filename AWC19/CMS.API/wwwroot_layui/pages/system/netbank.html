
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title></title>
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="stylesheet" href="/static/css/font.css" />
    <link rel="stylesheet" href="/static/css/weadmin.css" />
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->



</head>

<body>
    <div class="weadmin-nav">
        <span class="layui-breadcrumb">
            <a href="javascript:;">首页</a> <a href="javascript:;">会员管理</a>
            <a href="javascript:;"> <cite>会员列表</cite></a>
        </span>
        <a class="layui-btn layui-btn-sm" style="margin-top:3px;float:right" href="javascript:location.replace(location.href);"
           title="刷新">
            <i class="layui-icon layui-icon-refresh"></i>
            <!-- <i class="layui-icon" style="line-height:30px">&#x1002;</i> -->
        </a>

    </div>

    <div class="weadmin-body">
        <div class="layui-row">

            <!--账户   提款姓名   提款卡号    提款状态    提款地址    代理   IP-->

            <form class="layui-form layui-col-md12 we-search" lay-filter="formfield" id="formfield">
                <div class="layui-inline">
                    <input class="layui-input" name="name" placeholder="标记名" />
                </div>
                <div class="layui-inline">
                    <input class="layui-input" name="realname" placeholder="卡名" />
                </div>

                <div class="layui-inline">
                    <input class="layui-input" name="cardno" placeholder="卡号" />
                </div>

                <div class="layui-inline">
                    <select class="layui-input" name="status">
                        <option value=-1 selected>===网站状态===</option>
                        <option value=0>未使用</option>
                        <option value=1>启用</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <select class="layui-input" name="appstatus">
                        <option value=-1 selected>===APP状态===</option>
                        <option value=0>未使用</option>
                        <option value=1>启用</option>
                    </select>
                </div>

                <div class="layui-inline">
                    <select class="layui-input" name="classname">
                        <option value="" selected>==卡类型==</option>
                        <option value="ATM汇款">ATM汇款</option>
                        <option value="网银转账">网银转账</option>
                        <option value="支付宝转账">支付宝转账</option>
                    </select>
                </div>


                <button class="layui-btn layui-btn-normal" id="FORM-getval" lay-submit="" lay-filter="searchbutton">
                    <i class="layui-icon layui-icon-search"></i>查询
                </button>

                <!--<button class="layui-btn layui-btn-normal" id="FORM-getval" v-on:click="search(0)">
        <i class="layui-icon layui-icon-search"></i>刷新本日收款
    </button>-->

            </form>
        </div>


        <table class="layui-table" id="app">
            <thead>
                <tr>

                    <!--名称	银行讯息	类型	本日收款	收款上线	网站状态 	APP状态-->
                    <th>名称</th>
                    <th>银行讯息</th>
                    <th>类型</th>
                    <th>本日收款</th>
                    <th>收款上线</th>
                    <th>网站状态</th>
                    <th>APP状态</th>
                    <!--<th>管理</th>-->

                </tr>
            </thead>
            <tbody>
                <template v-for="(item, index) in recordlist">
                    <tr class="more_info_k" v-on:dblclick="edititem(item)">

                        <!--<td>
                            <div class="layui-unselect layui-form-checkbox" lay-skin="primary" data-id="1">
                                <i class="layui-icon">&#xe605;</i>
                            </div>
                        </td>-->
                        <!--<td>{{ item.id }}<i class="layui-icon">&#xe625;</i></td>-->
                        <td>{{item.name}}</td>
                        <td>{{item.realname}}【{{item.bank}}】 {{item.cardno}}</td>
                        <td>{{item.classname}}</td>
                        <td></td>
                        <td>{{item.paymentcap | currency}}</td>
                        <td>
                            <input v-model="item.statuschecked" v-on:change="switchwebstatus(item)" class="table_checkbox" type="checkbox" name="statuschecked" />

                            <!--<a class="layui-btn layui-btn-xs" v-if="item.status==1">网站在用</a>
                            <a class="layui-btn layui-btn-xs layui-bg-gray" v-if="item.status==0">未开启</a>-->
                        </td>
                        <td>
                            <!--<input type="checkbox" name="" title="写作" lay-skin="primary" v-model="item.appstatuschecked">-->
                            <input v-model="item.appstatuschecked" v-on:change="switchappstatus(item)" class="table_checkbox" type="checkbox" name="appstatuschecked" />
                            <!--<a class="layui-btn layui-btn-xs" v-if="item.appstatus==1">在使用</a>
                            <a class="layui-btn layui-btn-xs layui-bg-gray" v-if="item.appstatus==0">未开启</a>-->
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
        <!-- 分页 -->
        <div style="text-align:center">
            <div id="pager"></div>
        </div>
    </div>
    <script src="/design/layui.all.js"></script>
    <script src="/static/js/eleDel.js"></script>
    <script src="/js/vue.js"></script>
    <script src="/js/axios.js"></script>
    <script src="/js/globalmixin.js"></script>
    <script>
        var app = new Vue({
            el: '#app',
            data: {
                input: {
                    pagesize: 10,
                    status: -1
                },
                teststatus: 0,
                recordlist: [],
                statuslist: [
                    { id: -1, label: "所有" },
                    { id: 0, label: "未审核" },
                    { id: 1, label: "等待支付" },
                    { id: 2, label: "支付成功" },
                    { id: 3, label: "提款取消" },
                ]
            },
            computed: {

            },
            mounted: function () {
                // Grab initial data
                this.$nextTick(function () {
                    this.search(0, 10);
                });
            },
            methods: {
                edititem: function (x) {
                    WeAdminEdit(x.classname + '【' + x.name + '】',
                        './netbank_edit.html?' + this.toqueryparams(x), 10, 400, 350);
                },
                initpager: function (curPage, totalRecord) {
                    var self = this;
                    layui.use('laypage', function () {
                        var laypage = layui.laypage;
                        laypage.render({
                            elem: 'pager',
                            curr: curPage,
                            count: totalRecord,
                            limit: self.input.pagesize,
                            limits: [2, 10, 20, 30, 50],
                            layout: ['count', 'prev', 'page', 'next', 'limit', 'skip']
                            , jump: function (obj, first) {
                                console.info(obj);
                                console.info('limit:' + obj.limit);

                                if (!first) {
                                    self.search(obj.curr, obj.limit);
                                    //do something
                                }

                                //limit = obj.limit;
                                //var pageIndex = obj.curr;
                                //if (!first) {
                                //    var ant = $("#queryForm").find("input[name='account']").val();
                                //    var data = data = { "account": ant, "afpaymentlivetype": 1, "pageSize": limit, "pageIndex": pageIndex };
                                //    loadPageData(data);
                                //}
                            }
                        })
                    });

                },
                switchwebstatus: function (x) {
                    console.info(x.id, " ", x.statuschecked);
                    this.postwithauth('/Website/BankCardSwitch', { id:x.id, onoff:x.statuschecked },
                        function (response) {
                            console.info('====/Website/BankCardSwitch====');
                            console.info(response);
                        });

                },
                switchappstatus: function (x) {
                    console.info(x.id, " ", x.appstatuschecked);
                    this.postwithauth('/Website/BankCardSwitch', { id:x.id, apponoff:x.appstatuschecked },
                        function (response) {
                            console.info('====/Website/BankCardSwitch====');
                            console.info(response);
                        });

                },
                search: function (_pageindex, pagesize) {
                    //console.info('pageindex:' + _pageindex + " pagesize:" + pagesize);
                    var self = this;
                    //try {
                    //    var form_status = layui.jquery('#form_status').val();
                    //    this.input.status = form_status >= 0 ? parseInt(form_status) : -1;
                    //} catch (e) { }

                    //if (!this.input.name) this.input.name = null;
                    //if (!this.input.realname) this.input.realname = null;
                    //if (!this.input.cardno) this.input.cardno = null;
                    ////if (!this.input.appstatus) this.input.appstatus = null;
                    //if (!this.input.classname) this.input.classname = null;
                    //if (!this.input.appstatus < 0) this.input.appstatus = null;
                    //this.input.Page = _pageindex;
                    //this.input.pagesize = pagesize;


                    var _where = layui.$('#formfield').serializeArray();
                    _where = this.ArrayToObject(_where);
                    _where.status = parseInt(_where.status);
                    _where.appstatus = parseInt(_where.appstatus);
                    _where.type = parseFloat(_where.type);
                    _where.page = _pageindex != null ? _pageindex : 0;
                    _where.pagesize = this.pagesize = pagesize;


                    this.postwithauth('/Website/BankCardRecord', _where,
                        function (response) {
                            if (response.status == 200 && response.data.code == 1) {
                                var y = response.data.data.data;
                                for (var i = 0; i < y.length; i++) {
                                    y[i].statuschecked = y[i].status == 1 ? true : false;
                                    y[i].appstatuschecked = y[i].appstatus == 1 ? true : false;
                                }
                                self.recordlist = y;
                                var totalItems = response.data.data.totalItems;
                                //console.info("totalItems: " + totalItems +
                                //    "pagecount: " + self.pagemodel.pagecount);
                                console.info('=====self.recordlist=====');
                                console.info(self.recordlist);
                                self.initpager(_pageindex, totalItems);
                            }
                            else
                                console.info(response);

                            //setTimeout(function () {
                            //    layui.use(['jquery'], function () {
                            //        var $ = layui.jquery;
                            //        $('.more_info_k').on('click', function () {
                            //            $(this).nextUntil('.more_info_k').toggleClass('hide');
                            //        });
                            //    });
                            //}, 500);
                        });
                    return false;

                }
            }
        });

        layui.use(['form', 'laydate'], function () {
            var laydate = layui.laydate,
                form = layui.form;
            //laydate.render({
            //    elem: '#start'
            //    , type: 'datetime'
            //});
            //laydate.render({
            //    elem: '#end'
            //    , type: 'datetime'
            //});
            form.on('submit(searchbutton)', function (data) {
                app.search(0, app.pagesize);
                return false;
            });
            form.on('submit(addbutton)', function (data) {
                WeAdminShow('添加公告', './notice_add.html', 500, 400)
                return false;
            });
        });



    </script>

</body>
</html>
