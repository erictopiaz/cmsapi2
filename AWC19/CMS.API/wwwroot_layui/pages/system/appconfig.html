<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>反水列表</title>
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="stylesheet" href="../../static/css/font.css" />
    <link rel="stylesheet" href="../../static/css/weadmin.css" />
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body>
    <div class="weadmin-nav">
        <span class="layui-breadcrumb">
            <a href="javascript:;">首页</a> <a href="javascript:;">会员管理</a>
            <a href="javascript:;"> <cite>会员列表</cite></a>
        </span>
        <a class="layui-btn layui-btn-sm" style="margin-top:3px;float:right" href="javascript:location.replace(location.href);"
           title="刷新">
            <i class="layui-icon layui-icon-refresh"></i>
            <!-- <i class="layui-icon" style="line-height:30px">&#x1002;</i> -->
        </a>
    </div>
    <div class="weadmin-body">
        <div class="layui-row">
        </div>
        <div class="table_scroll" id="maintable">
            <table lay-even class="layui-table">
                <thead>
                    <tr>
                        <th>代码</th>
                        <th>参数</th>
                        <th>说明</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item, index) in todos" :key="index">
                        <td><div class="td_inpuedit">{{ item.code }}</div></td>
                        <td>
                            <input class="td_infpuedit" v-model="item.content">
                        </td>
                        <td><div class="td_inpuedit" contenteditable>{{ item.desc }}</div></td>
                    </tr>

                </tbody>
                <!--<tfoot>
                    <tr class="total">
                        <td>合计</td>
                        <td>6586</td>
                        <td>0.03</td>
                    </tr>
                </tfoot>-->
            </table>

            <button class="layui-btn layui-btn-normal" id="FORM-getval" lay-submit="" lay-filter="searchbutton" v-on:click="test">
                <i class="layui-icon layui-icon-search"></i>查询
            </button>
        </div>
    </div>
    <script src="/design/layui.js"></script>
    <script src="/static/js/eleDel.js"></script>
    <script src="/js/vue.js"></script>
    <script src="/js/axios.js"></script>
    <script src="/js/globalmixin.js"></script>

    <script>

        var app = new Vue({
            el: '#maintable',
            data: {
                todos: null,
                pagesize: 10
            },
            mounted: function () {
                this.search(0, this.pagesize);
            },
            methods: {
                update: function (event) {
                    this.$emit('update', event.target.innerText);
                },
                test: function () {
                    console.info(JSON.stringify(this.todos));
                },
                initpager: function (curPage, totalRecord) {
                    var self = this;
                    layui.use('laypage', function () {
                        var laypage = layui.laypage;
                        laypage.render({
                            elem: 'pager',
                            curr: curPage,
                            count: totalRecord,
                            limit: self.pagesize,
                            limits: [2, 10, 20, 30, 50],
                            layout: ['count', 'prev', 'page', 'next', 'limit', 'skip']
                            , jump: function (obj, first) {
                                //console.info(obj);
                                //console.info('limit:' + obj.limit);
                                if (!first) {
                                    self.search(obj.curr, obj.limit);
                                }
                            }
                        })
                    });

                },
                search: function (_pageindex, pagesize) {
                    var self = this;

                    this.postwithauth('/Website/AppConfig', {},
                        function (response) {
                            if (response.status == 200 && response.data.code == 1) {
                                self.todos = response.data.data.config;
                            }
                            else
                                console.info(response);
                        });
                    return false;
                }
            }

        });

        layui.use(['table', 'form'], function () {
            var table = layui.table,
                form = layui.form;
        })
    </script>
</body>
</html>
