    <link href="/static/css/weadmin.css" rel="stylesheet" />

    <script src="~/lib/jquery/json2.min.js"></script>-->

<body>
    <div class="weadmin-nav">
        <span class="layui-breadcrumb">
            <a href="javascript:;">首页</a> <a href="javascript:;">会员管理</a>
            <a href="javascript:;"> <cite>会员列表</cite></a>
        </span>
        <a class="layui-btn layui-btn-sm" style="margin-top:3px;float:right" href="javascript:location.replace(location.href);"

            <i class="layui-icon layui-icon-refresh"></i>
            <!-- <i class="layui-icon" style="line-height:30px">&#x1002;</i> -->
        </a>
    </div>
    <div class="weadmin-body">
        <div class="layui-row">
            <form class="layui-form layui-col-md12 we-search" lay-filter="goBonus" id="formfield">
                检索条件：
                <div class="layui-inline">

                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="姓名" name="realname" />
                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="邮箱" name="email" />
                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="电话" name="telephone" />
                </div>
                <div class="layui-inline">
                    <input class="layui-input" placeholder="QQ" name="qq" />
                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="网址" name="referrerreg" />
                </div>

                <!--<div class="layui-inline">
                    <select class="layui-input" name="status">
                        <option value=-1 selected>==所有状态==</option>
                        <option value=0>冻结</option>
                        <option value=1>正常</option>
                    </select>
                </div>-->


                <div class="layui-inline">
                    <input class="layui-input" placeholder="代理" name="affaccount" />
                </div>
                <div class="layui-inline">

                </div>
                <div class="layui-inline">
                    <input class="layui-input" placeholder="存款" type="number" name="depositamount" />
                </div>
                <div class="layui-inline">
                    <select class="layui-input" name="level">
                        <option value=-1 selected>==所有会员等级==</option>
                        <option value=10002>黄金VIP</option>
                        <option value=10006>忠实玩家</option>
                        <option value=10007>普通玩家</option>
                        <option value=10004>钻石VIP</option>
                        <option value=10005>特邀VIP</option>
                        <option value=10025>至尊VIP</option>
                        <option value=10012>见习VIP</option>
                        <option value=10027>白银VIP</option>
                        <option value=10028>白玉VIP</option>
                        <option value=10001>万象会员</option>
                        <option value=10026>核查级别</option>
                        <option value=10011>老虎机俱乐部</option>
                        <option value=10023>爵士返水</option>
                        <option value=10003>铂金VIP</option>
                        <option value=10020>国王现金</option>
                        <option value=10022>公爵返水</option>
                        <option value=10019>公爵现金</option>
                        <option value=10018>爵士现金</option>
                        <option value=10017>骑士现金</option>
                        <option value=10021>国王返水</option>
                        <option value=10024>骑士返水</option>
                    </select>
                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="BB账户" name="bbinaccount" />
                </div>
                <div class="layui-inline">
                    <input class="layui-input" placeholder="IP" name="ipaddress" />
                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="开始时间" name="starttime" id="start" />
                </div>

                <div class="layui-inline">
                    <input class="layui-input" placeholder="结束时间" name="endtime" id="end" />
                </div>


                <button class="layui-btn layui-btn-normal" id="FORM-getval" lay-submit="" lay-filter="searchbutton">
                    <i class="layui-icon layui-icon-search"></i>查询
                </button>
            </form>
        </div>
        <!--<div class="weadmin-block">
            <button class="layui-btn layui-btn-normal" onclick="WeAdminShow('添加','/Promo/EditContent?s=0&tid=0',600,400)">
                <i class="layui-icon layui-icon-add-circle-fine"></i>添加
            </button>
        </div>-->
        <div class="table_scroll" id="maintable">
            <table lay-even class="layui-table">
                <thead>
                    <tr>
                        <th>账号</th>
                        <th>姓名</th>
                        <th>来源网址</th>
                        <th>注册IP</th>
                        <th>创建时间</th>
                        <th>会员等级</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="item in todos">
                        <td v-on:dblclick="editaccount(item.account)">{{item.account}}</td>
                        <td>{{item.realname}}</td>
                        <td>{{item.referrerreg}}</td>
                        <td>{{item.ipaddress}}</td>
                        <td>{{item.createtime | standarddate}}</td>
                        <td>{{item.levelname}}</td>
                        <td>
                            <span v-if="item.status==0" class="layui-btn layui-btn-xs layui-bg-red">冻结</span>
                            <span v-if="item.status==1" class="layui-btn layui-btn-xs">正常</span>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div style="text-align:center">
                <div id="pager"></div>
            </div>

        </div>
    </div>
    <script src="/design/layui.all.js"></script>
    <script src="/static/js/eleDel.js"></script>
    <script src="/js/vue.js"></script>
    <script src="/js/axios.js"></script>
    <script src="/js/globalmixin.js"></script>

    <script>

        var app = new Vue({
            el: '#maintable',
            data: {
                todos: null,
                pagesize: 10
            },
            mounted: function () {
                this.search(0, this.pagesize);
            },
            methods: {
                initpager: function (curPage, totalRecord) {
                    var self = this;
                    layui.use('laypage', function () {
                        var laypage = layui.laypage;
                        laypage.render({
                            elem: 'pager',
                            curr: curPage,
                            count: totalRecord,
                            limit: self.pagesize,
                            limits: [2, 10, 20, 30, 50],
                            layout: ['count', 'prev', 'page', 'next', 'limit', 'skip']
                            , jump: function (obj, first) {
                                //console.info(obj);
                                //console.info('limit:' + obj.limit);
                                if (!first) {
                                    self.search(obj.curr, obj.limit);
                                }
                            }
                        })
                    });

                },
                search: function (_pageindex, pagesize) {
                    var self = this;
                    //console.info('pageindex:' + _pageindex + " pagesize:" + pagesize);
                    var _where = layui.$('#formfield').serializeArray();
                    _where = this.ArrayToObject(_where);
                    _where.status = -1;//parseInt(_where.status);
                    _where.level = parseInt(_where.level);
                    _where.depositamount = parseFloat(_where.depositamount);
                    _where.starttime = _where.starttime !=null ? this.getdate(_where.starttime) : null;
                    _where.endtime = _where.endtime != null ? this.getdate(_where.endtime) : null;

                    _where.page = _pageindex != null ? _pageindex : 0;
                    _where.pagesize = this.pagesize = pagesize;

                    this.postwithauth('/Account/SearchAccount', _where,
                        function (response) {
                            if (response.status == 200 && response.data.code == 1) {
                                self.todos = response.data.data.data;
                                var totalItems = response.data.data.totalItems;
                                self.initpager(_pageindex, totalItems);
                            }
                            else
                                console.info(response);
                        });
                    return false;
                }
            }

        });

        layui.use(['form', 'laydate'], function () {
            var laydate = layui.laydate,
                form = layui.form;
            laydate.render({
                elem: '#start'
                , type: 'datetime'
            });
            laydate.render({
                elem: '#end'
                , type: 'datetime'
            });
            form.on('submit(searchbutton)', function (data) {
                app.search(0, app.pagesize);
                return false;
            });
        });

    </script>
</body>
</html>
