    <script src="/lib/layui/layui.js" charset="utf-8"></script>
    <script src="/static/js/eleDel.js" type="text/javascript" charset="utf-8"></script>

    <script src="/js/axios.js"></script>
    <script src="/js/globalmixin.js"></script>
    <script>
        var app = new Vue();
        var filters = app.$options.filters;
        layui.use(['table', 'form'], function () {
            var table = layui.table;

            var _headers = {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('acow8unasvef')
            };
            var _request = {
                pageName: 'page' //页码的参数名称，默认：page
                , limitName: 'pagesize' //每页数据量的参数名，默认：limit
            };


            window.editaccount = function (item_id) {
                WeAdminEdit('编辑', './edit.html?id=' + item_id, 1, 800, 400);
            }

            var _where = { status: -1, level: -1 };

            var maintable = table.render({
                elem: '#maintable'
                , url: _API + '/Account/SearchAccount' //数据接口
                , method: 'post'
                , contentType: 'application/json'
                , cellMinWidth: 63
                , headers: app.postheaders()
                , request: _request
                , where: _where
                , page: {
                    limits: [2, 10, 20, 30, 50],
                    layout: ['count', 'prev', 'page', 'next', 'limit', 'skip']
                }//开启分页
                , cols: [[ //表头
                    //{ field: 'account', title: '账号', sort: true, fixed: 'left', cellMinWidth: 153 }
                    //, { field: 'realname', title: '姓名', cellMinWidth: 74 }
                    ////, { field: 'birthday', title: '生日', sort: true }
                    //, { field: 'referrerreg', title: '来源网址', cellMinWidth: 256 }
                    //, { field: 'ipaddress', title: '注册IP', cellMinWidth: 135 }
                    //, {
                    //    field: 'createtime', title: '创建时间	', sort: true, cellMinWidth: 161, templet: function (d) {return filters.standarddate(d.createtime);
                    //    }
                    //}
                    //, { field: 'levelname', title: '会员等级', sort: true, cellMinWidth: 102 }
                    //, { field: 'status', title: '状态', templet: '#statusTpl', cellMinWidth: 66 }
                    //, { field: '', title: '操作', toolbar: '#barDemo', cellMinWidth: 66 }

                    { field: 'account', title: '账号', sort: true, fixed: 'left', toolbar: '#accountTpl' }
                    , { field: 'realname', title: '姓名' }
                    //, { field: 'birthday', title: '生日', sort: true }
                    , { field: 'referrerreg', title: '来源网址' }
                    , { field: 'ipaddress', title: '注册IP' }
                    , {
                        field: 'createtime', title: '创建时间	', sort: true, templet: function (d) {
                            return filters.standarddate(d.createtime);
                        }
                    }
                    , { field: 'levelname', title: '会员等级', sort: true }
                    , { field: 'status', title: '状态', templet: '#statusTpl', width: 66 }
                    , { field: '', title: '操作', toolbar: '#barDemo', width: 66 }



                ]]
                , parseData: function (res) { //res 即为原始返回的数据
                    return {
                        "code": res.code == 1 ? 0 : 1, //解析接口状态
                        "msg": res.message, //解析提示文本
                        "count": res.data.totalItems, //解析数据长度
                        "data": res.data.data //解析数据列表
                    };
                }
            });

            //监听工具条
            table.on('tool(main)', function (obj) { //注：tool 是工具条事件名，test 是 table 原始容器的属性 lay-filter="对应的值"
                var data = obj.data; //获得当前行数据
                var layEvent = obj.event; //获得 lay-event 对应的值（也可以是表头的 event 参数对应的值）
                switch (layEvent) {
                    case 'details':
                        WeAdminEdit('编辑', '../member/edit.html?id=' + data.account, 1, 800, 400);
                        break;
                    default: break;
                }
            });


            var form = layui.form;


            //表单取值
            layui.$('#FORM-getval').on('click', function () {
                _where = layui.$('#formtest').serializeArray();
                _where = app.ArrayToObject(_where);
                _where.status = -1;//parseInt(_where.status);
                _where.level = parseInt(_where.level);
                _where.depositamount = parseFloat(_where.depositamount);
                maintable.reload({ where: _where, page: { curr: 1 } });
                return false;
            });
        });
    </script>
