
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>优惠内容管理</title>
    <meta name="renderer" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="stylesheet" href="../../static/css/font.css" />
    <link rel="stylesheet" href="../../static/css/weadmin.css" />
    <!-- 让IE8/9支持媒体查询，从而兼容栅格 -->
    <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body>
    <div class="weadmin-nav">
        <span class="layui-breadcrumb">
            <a href="javascript:;">首页</a> <a href="javascript:;">会员管理</a>
            <a href="javascript:;"> <cite>会员列表</cite></a>
        </span>
        <a class="layui-btn layui-btn-sm" style="margin-top:3px;float:right" href="javascript:location.replace(location.href);"
           title="刷新">
            <i class="layui-icon layui-icon-refresh"></i>
            <!-- <i class="layui-icon" style="line-height:30px">&#x1002;</i> -->
        </a>
    </div>
    <div class="weadmin-body">
        <div class="layui-row">
            <form class="layui-form layui-col-md12 we-search" lay-filter="formtest" id="formtest">
                检索条件：
                <div class="layui-inline">
                    <input class="layui-input" name="content" placeholder="标题" />
                </div>

                <div class="layui-inline">
                    <select class="layui-input" name="type">
                        <option value=-1 selected>==公告类型==</option>
                        <option value=0>普通公告</option>
                        <option value=2>合营公告</option>
                        <option value=100>提示公告</option>
                    </select>
                </div>

                <div class="layui-inline">
                    <select class="layui-input" name="status">
                        <option value=-1 selected>==状态==</option>
                        <option value=0>关闭</option>
                        <option value=1>启用</option>
                    </select>
                </div>


                <button class="layui-btn layui-btn-normal" id="FORM-getval">
                    <i class="layui-icon layui-icon-search"></i>查询
                </button>
            </form>
        </div>
        <div class="weadmin-block">
            <button class="layui-btn layui-btn-normal" onclick="WeAdminShow('添加公告','./notice_add.html',500,400)">
                <i class="layui-icon layui-icon-add-circle-fine"></i>添加
            </button>
            <!--<span class="fr" style="line-height:40px">共有数据：88 条</span>-->
        </div>


        <table id="maintable" lay-filter="test"></table>

        <script type="text/html" id="barDemo">
            <a class="layui-btn layui-btn-xs" lay-event="edit" onclick="WeAdminEdit('编辑','./content_edit.html', 1, 400, 400)">编辑</a>
            <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del" onclick="member_del(this,'要删除的id')">删除</a>
        </script>

        <script type="text/html" id="toolTpl">
            <a class="layui-btn layui-btn-xs"
               lay-event="edit"
               onclick="WeAdminEdit('编辑', './notice_edit.html?id={{d.id}}&content={{d.body}}&expire={{d.expiredate}}' , 10, 400, 350)">
                编辑
            </a>
        </script>

        <script type="text/html" id="expireTpl">
            {{#  if(Date.parse(d.expiredate) < Date.now()){ }}
            <span class="layui-badge layui-bg-gray">过期了 {{d.expiredate}}</span>
            {{#  } else if(Date.parse(d.expiredate) >= Date.now()){  }}
            <span class="layui-badge layui-bg-green">启用 {{d.expiredate}}</span>
            {{#  } else {  }}
            <span class="layui-badge layui-bg-red">未知状态 {{d.expiredate}}</span>
            {{#  } }}
        </script>



        <script type="text/html" id="statusTpl">
            <input type="checkbox" name="lock" value="{{d.id}}" title="启用" lay-filter="statusToggle" {{ d.status ? 'checked' : '' }}>
        </script>

    </div>
    <script src="/lib/layui/layui.js" charset="utf-8"></script>
    <script src="/static/js/eleDel.js" type="text/javascript" charset="utf-8"></script>
    <script>
        layui.use(['table', 'form'], function () {
            var table = layui.table;

            var _headers = {
                'Content-Type': 'application/json',
                'Authorization': localStorage.getItem('acow8unasvef')
            };
            var _request = {
                pageName: 'page' //页码的参数名称，默认：page
                , limitName: 'pagesize' //每页数据量的参数名，默认：limit
            };

            //function editnotice(url) {
            //    layer.open({
            //        type: 2,
            //        area: [w + 'px', h + 'px'],
            //        fix: false, //不固定
            //        maxmin: true,
            //        shadeClose: true,
            //        shade: 0.4,
            //        title: title,
            //        content: url,
            //        success: function (layero, index) {
            //            //向iframe页的id=house的元素传值  // 参考 https://yq.aliyun.com/ziliao/133150
            //            var body = layer.getChildFrame('body', index);
            //            body.contents().find("#dataId").val(id);
            //            console.log(id);
            //        },
            //        error: function (layero, index) {
            //            alert("aaa");
            //        }
            //    });
            //}

            var _where = {};


            /*      SAMPLE REQUEST
             *      {
                      "page": 0,
                      "pageSize": 0,
                      "content": "string",
                      "status": 0,
                      "type": 0
                    }
             *
             *      SAMPLE DATA
                    "id": 12825,
                    "body": "尊敬的VIP会员:VIP晋级已经处理完毕，请大家自行登陆查看各自级别，万象福地，祝大家多多盈利",
                    "createtime": "2019-10-05T11:05:48.157",
                    "expiredate": "2019-10-08T00:00:00",
                    "status": 1,
                    "type": 0,
                    "totalItems": 2809
             */
            var maintable = table.render({
                elem: '#maintable'
                , url: '/api/Website/NoticeRecord' //数据接口
                , method: 'post'
                , contentType: 'application/json'
                , headers: _headers
                , request: _request
                , where: _where
                , page: true //开启分页
                , cols: [[ //表头
                    { field: 'createtime', title: '创建时间' }
                    , { field: 'body', title: '内容' }
                    , { field: 'expiredate', title: '过期时间', sort: true, templet: '#expireTpl' }
                    , { field: 'status', title: '状态', sort: true, templet: '#statusTpl' }
                    , { field: 'typename', title: '公告类型' }
                    , { field: '', title: '管理', sort: true, toolbar: '#toolTpl' }


                ]]
                , parseData: function (res) { //res 即为原始返回的数据
                    return {
                        "code": res.code == 1 ? 0 : 1, //解析接口状态
                        "msg": res.message, //解析提示文本
                        "count": res.data.totalItems, //解析数据长度
                        "data": res.data.data //解析数据列表
                    };
                }
            });



            var form = layui.form;
            function ArrayToObject(arr) {
                var obj = {};
                for (var i = 0; i < arr.length; i++)
                    if (arr[i].value != undefined && arr[i].value != null && arr[i].value != '')
                        obj[arr[i].name] = arr[i].value;
                    else
                        obj[arr[i].name] = null;
                return obj;
            }
            //表单取值
            layui.$('#FORM-getval').on('click', function () {
                _where = layui.$('#formtest').serializeArray();
                _where = ArrayToObject(_where);
                _where.status = parseInt(_where.status);
                _where.type = parseInt(_where.type);
                console.info(_where);
                maintable.reload({ where: _where, page: { curr: 1 } });
                return false;
            });


            form.on('checkbox(statusToggle)', function (obj) {
                var self = this;
                var _data = {
                    Id: parseInt(this.value),
                    OnOff: obj.elem.checked
                };
                console.info(_data);
                var jsonData = JSON.stringify(_data);
                layui.$.ajax({
                    type: "post",
                    url: "/api/Website/NoticeSwitch",
                    headers: _headers,
                    contentType: "application/json;",
                    dataType: "json",
                    data: jsonData,
                    success: function (result) {
                        var message = _data.OnOff ? "已启用" : "已停用";
                        if (result.code != 1) message = result.message;
                        //console.info(result);
                        layer.tips(message, obj.othis);
                    }
                });
            });
        });
    </script>



</body>
</html>
